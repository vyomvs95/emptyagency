<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>empty agency — UI/UX &amp; 3D design studio</title>
    <meta
      name="description"
      content="empty agency is a UI/UX and 3D design studio — apps, platforms and websites; CGI product films, explainers, walkthroughs and renders; and the films and artwork that launch them. We clear the clutter."
    />
    <meta name="theme-color" content="#f4f4f2" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Paint the correct ground colour before React mounts (no theme flash).
         The site always opens in LIGHT mode. The OS `prefers-color-scheme`
         is deliberately ignored: dark is opt-in, and only a previous
         explicit choice by this visitor carries over. -->
    <script>
      try {
        if (localStorage.getItem('empty-agency:theme') === 'dark') {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      EMPTY AGENCY // THIS CANVAS REQUIRES JAVASCRIPT. STATUS: OFFLINE.
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
